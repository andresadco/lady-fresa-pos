<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Lady Fresa · Ventas</title>
<link rel="icon" type="image/png" href="img/marca/icono-192.png">
<link rel="apple-touch-icon" href="img/marca/icono-512.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20C0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --vino:#A6182E; --vino-2:#672626; --rosa:#FD9CB3; --rosa-2:#FDEEF1; --fondo:#FDF6F7; --blanco:#fff;
  --tinta:#2a0d12; --tinta-2:#6b3a42; --tinta-3:#a07a80; --linea:#f1d9de;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--fondo);color:var(--tinta);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(76px + var(--bot))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--vino);outline-offset:2px}
.num{font-family:'Lilita One','DM Sans',sans-serif;font-weight:400;letter-spacing:.3px;font-variant-numeric:tabular-nums}

/* ── Bloque principal ── */
.hero{position:relative;overflow:hidden;background:var(--vino);color:#fff;padding:calc(14px + var(--top)) 20px 22px;border-radius:0 0 28px 28px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{height:26px;display:block}
.hero-meta{font-size:12px;color:#ffd3dd;display:flex;align-items:center;gap:8px}
.vivo{width:7px;height:7px;border-radius:50%;background:var(--rosa);animation:latido 2.4s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(253,156,179,.6)}70%{box-shadow:0 0 0 8px rgba(253,156,179,0)}100%{box-shadow:0 0 0 0 rgba(253,156,179,0)}}
.btn-ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:16px;display:grid;place-items:center}
.periodos{display:flex;gap:6px;margin:18px 0 0;background:rgba(0,0,0,.14);padding:4px;border-radius:14px}
.periodos button{flex:1;padding:8px 0;border-radius:10px;font-size:13px;font-weight:600;color:#ffd3dd}
.periodos button.on{background:#fff;color:var(--vino)}
.venta{margin-top:20px;position:relative;z-index:1;max-width:68%}
.venta-lbl{font-size:13px;color:#ffd3dd}
.venta-total{font-size:clamp(38px,12.5vw,54px);line-height:1.02;margin-top:2px;word-break:break-all}
.venta-cent{font-size:24px;opacity:.75}
.delta{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);padding:6px 11px;border-radius:999px}
.mascota{position:absolute;right:-18px;bottom:-14px;width:46%;max-width:210px;pointer-events:none;transform-origin:bottom right}
.mascota.salta{animation:salta .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes salta{0%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-3deg)}100%{transform:translateY(0)}}

/* ── Sucursales ── */
.sucs{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px;scrollbar-width:none}
.sucs::-webkit-scrollbar{display:none}
.sucs button{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--blanco);border:1.5px solid var(--linea);font-size:13px;font-weight:600;color:var(--tinta-2)}
.sucs button.on{background:var(--vino-2);border-color:var(--vino-2);color:#fff}

/* ── Secciones ── */
main{padding:6px 20px 0}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linea);border-radius:18px;overflow:hidden;margin-top:12px}
.cifra{background:var(--blanco);padding:14px 12px}
.cifra .num{font-size:24px;color:var(--vino-2);display:block}
.cifra small{font-size:12px;color:var(--tinta-3);display:block;margin-top:2px}
.cifra .vs{font-size:11px;color:var(--tinta-3);margin-top:4px}
section{margin-top:26px}
h2{font-size:17px;font-weight:700;color:var(--tinta);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
h2 .aux{font-size:13px;font-weight:500;color:var(--tinta-3)}
h2 button{font-size:13px;font-weight:600;color:var(--vino)}
.vacio{padding:18px;border-radius:16px;background:var(--blanco);color:var(--tinta-3);font-size:14px;text-align:center}

.fila{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:none}
.fila .nom{font-weight:600;font-size:14px}
.fila .val{font-weight:700;font-size:14px;text-align:right}
.fila .sub{font-size:12px;color:var(--tinta-3)}
.fila .sub.r{text-align:right}
.barra{grid-column:1/-1;height:8px;border-radius:99px;background:var(--rosa-2);overflow:hidden;margin-top:4px}
.barra i{display:block;height:100%;border-radius:99px;background:var(--vino);transition:width .6s ease}
.lista{background:var(--blanco);border-radius:18px;padding:4px 16px}

.horas{background:var(--blanco);border-radius:18px;padding:16px 14px 10px}
.horas-graf{display:flex;align-items:flex-end;gap:4px;height:110px}
.horas-graf div{flex:1;background:var(--rosa);border-radius:5px 5px 2px 2px;min-height:3px;position:relative}
.horas-graf div.pico{background:var(--vino)}
.horas-graf div.ahora::after{content:'';position:absolute;left:50%;top:-8px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--vino-2)}
.horas-eje{display:flex;gap:4px;margin-top:6px}
.horas-eje span{flex:1;text-align:center;font-size:10px;color:var(--tinta-3)}
.horas-nota{font-size:13px;color:var(--tinta-2);margin-top:10px}

.pagos{background:var(--blanco);border-radius:18px;padding:16px}
.pila{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--rosa-2)}
.pila i{display:block;height:100%}
.leyenda{display:grid;gap:8px;margin-top:14px}
.leyenda div{display:flex;align-items:center;gap:10px;font-size:14px}
.leyenda b{margin-left:auto;font-weight:700}
.leyenda em{font-style:normal;color:var(--tinta-3);font-size:12px;width:38px;text-align:right}
.punto{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.orden{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea);width:100%;text-align:left}
.orden:last-child{border-bottom:none}
.orden .hora{font-size:12px;color:var(--tinta-3);width:58px;flex-shrink:0;white-space:nowrap}
.orden .que{flex:1;min-width:0}
.orden .que b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orden .que span{font-size:12px;color:var(--tinta-3)}
.orden .tot{font-weight:700;font-size:15px}
.buscar{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--linea);background:var(--blanco);font:inherit;font-size:16px;outline:none;margin-bottom:10px}
.buscar:focus{border-color:var(--vino)}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--blanco);border:1.5px solid var(--linea);color:var(--tinta-2)}
.chips button.on{background:var(--rosa-2);border-color:var(--rosa);color:var(--vino)}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--linea);display:flex;padding:8px 10px calc(8px + var(--bot));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--tinta-3);padding:4px 0;border-radius:12px}
nav button span{font-size:20px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--vino)}
nav button.on span{filter:none;opacity:1}
.vista{display:none}
.vista.on{display:block}

.velo{position:fixed;inset:0;background:rgba(42,13,18,.45);z-index:40;display:none;align-items:flex-end}
.velo.on{display:flex}
.hoja{background:var(--fondo);width:100%;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + var(--bot))}
.hoja .asa{width:40px;height:4px;border-radius:9px;background:var(--linea);margin:4px auto 14px}
.hoja h3{font-family:'Lilita One',sans-serif;font-weight:400;font-size:26px;color:var(--vino)}
.hoja .info{font-size:13px;color:var(--tinta-3);margin:2px 0 14px}
.prod{background:var(--blanco);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.prod .l1{display:flex;justify-content:space-between;font-weight:600}
.prod .l2{font-size:12px;color:var(--tinta-3);margin-top:3px}
.tots{margin-top:12px;font-size:14px}
.tots div{display:flex;justify-content:space-between;padding:4px 0;color:var(--tinta-2)}
.tots .gran{font-weight:700;color:var(--tinta);font-size:17px;border-top:1px solid var(--linea);margin-top:6px;padding-top:10px}

.aviso{position:fixed;left:50%;bottom:calc(88px + var(--bot));transform:translate(-50%,20px);opacity:0;background:var(--vino-2);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:all .3s;z-index:50;white-space:nowrap}
.aviso.on{opacity:1;transform:translate(-50%,0)}

#lf-login{position:fixed;inset:0;z-index:99;background:var(--vino);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
#lf-login img{width:120px}
#lf-login p{font-size:15px;color:#ffd3dd}
#lf-login .dots{display:flex;gap:14px}
#lf-login .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
#lf-login .dot.on{background:#fff}
#lf-login .pad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;margin-top:6px}
#lf-login .pad button{height:64px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;font-size:26px;font-family:'Lilita One',sans-serif}
#lf-login .pad button:active{background:rgba(255,255,255,.3)}
#lf-login .err{min-height:20px;font-size:14px;color:#fff;font-weight:600}
@media (min-width:700px){ .hero,main,.sucs{max-width:640px;margin-left:auto;margin-right:auto} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div id="lf-login">
  <img src="img/marca/mascota-hola.png" alt="">
  <p>Pon tu PIN para ver las ventas</p>

<header class="hero">

// En el cel la sesión se queda guardada y se renueva sola.
const LF_AUTH_KEY='lf_auth_movil';
let LF_AUTH=null; try{ LF_AUTH=JSON.parse(localStorage.getItem(LF_AUTH_KEY)||'null'); }catch(e){}
function lfAuthSet(s){ LF_AUTH=s||null; try{ s?localStorage.setItem(LF_AUTH_KEY,JSON.stringify(s)):localStorage.removeItem(LF_AUTH_KEY); }catch(e){} }

window.fetch=async function(input,init){
  const url=typeof input==='string'?input:(input&&input.url)||'';
  if(!url.startsWith(SB_URL+'/rest/v1/')||!LF_AUTH) return _f(input,init);
  if(LF_AUTH.expires_at*1000-Date.now()<90000) await lfAuthRefresh();
  const go=()=>{ const h=new Headers((init&&init.headers)||{}); if(LF_AUTH) h.set('Authorization','Bearer '+LF_AUTH.access_token); return _f(input,{...(init||{}),headers:h}); };
  let r=await go(); if(r.status===401&&LF_AUTH&&await lfAuthRefresh()) r=await go(); return r;

let _pin='';

function lfPinDel(){ _pin=_pin.slice(0,-1); dots(); }

}
function lfSalir(){ lfAuthSet(null); clearInterval(_poll); mostrarPin(''); }

// ═══ FECHAS EN HORA DE CDMX (aunque el cel esté en otro país). CDMX = UTC-6 todo el año.
const MX_OFF=6*3600e3, DIA=864e5;
const mxNow=()=>new Date(Date.now()-MX_OFF);
const mxMid=d=>Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())+MX_OFF;
const mxHora=iso=>new Date(new Date(iso).getTime()-MX_OFF).getUTCHours();
function rangos(p){
  const n=mxNow(), hoy=mxMid(n), ahora=Date.now();
  if(p==='hoy')  return {de:hoy,a:hoy+DIA,cDe:hoy-DIA,cA:hoy,cCorte:ahora-DIA,lbl:'Llevan hoy',clbl:'ayer a esta hora'};
  if(p==='ayer') return {de:hoy-DIA,a:hoy,cDe:hoy-8*DIA,cA:hoy-7*DIA,cCorte:hoy-7*DIA,lbl:'Vendieron ayer',clbl:'el mismo día de la semana pasada'};
  if(p==='semana'){ const ini=hoy-((n.getUTCDay()+6)%7)*DIA;
    return {de:ini,a:hoy+DIA,cDe:ini-7*DIA,cA:ini,cCorte:ahora-7*DIA,lbl:'Llevan esta semana',clbl:'la semana pasada a esta altura'}; }
  const ini=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),1)+MX_OFF, pIni=Date.UTC(n.getUTCFullYear(),n.getUTCMonth()-1,1)+MX_OFF;
  return {de:ini,a:hoy+DIA,cDe:pIni,cA:ini,cCorte:pIni+(ahora-ini),lbl:'Llevan este mes',clbl:'el mes pasado a esta altura'};
}

// ═══ DATOS
let periodo='hoy', suc='all', vista='resumen', filtroPago='todas', ordenProd='qty';
let D={ord:[],items:[],cmp:{total:0,n:0,tk:0,pz:0},prods:[]}, _ultimaId=null, _poll=null, _arr=false;
const $=id=>document.getElementById(id);
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-MX');
const money2=n=>'$'+(Number(n)||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const horaTxt=iso=>new Date(iso).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit',timeZone:'America/Mexico_City'});
const fechaTxt=iso=>new Date(iso).toLocaleDateString('es-MX',{day:'numeric',month:'short',timeZone:'America/Mexico_City'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h12=h=>(h%12||12);

async function traerOrdenes(de,a){
  const s=suc!=='all'?`&sucursal=eq.${encodeURIComponent(suc)}`:'';
  const r=await fetch(`${SB_URL}/rest/v1/orders?select=id,created_at,order_number,sucursal,service_type,client_name,pay_method,subtotal,discount_amt,promo_nombre,iva,total,cash_received,change_given,cajero_name,pago_efectivo,pago_tarjeta,pago_transferencia,loyalty_cliente_id&created_at=gte.${new Date(de).toISOString()}&created_at=lt.${new Date(a).toISOString()}${s}&status=neq.cancelada&order=created_at.desc&limit=5000`,{headers:H});
  if(!r.ok) throw new Error('ordenes '+r.status);
  return r.json();
}
async function traerItems(ids){
  const out=[];
  for(let i=0;i<ids.length;i+=150){
    const r=await fetch(`${SB_URL}/rest/v1/order_items?select=order_id,product_name,size,qty,subtotal&order_id=in.(${ids.slice(i,i+150).join(',')})`,{headers:H});
    if(r.ok) out.push(...await r.json());
  }
  return out;
}
function pagos(o){
  const ef=+o.pago_efectivo||0, tj=+o.pago_tarjeta||0, tr=+o.pago_transferencia||0;
  if(ef+tj+tr>0) return {efectivo:ef,tarjeta:tj,transferencia:tr};
  const m=o.pay_method||'efectivo', t=+o.total||0;
  return {efectivo:m==='efectivo'?t:0,tarjeta:m==='tarjeta'?t:0,transferencia:m==='transferencia'?t:0};
}
function stats(ord,items){
  const total=ord.reduce((s,o)=>s+(+o.total||0),0), n=ord.length, pz=items.reduce((s,i)=>s+(+i.qty||1),0);
  return {total,n,tk:n?total/n:0,pz};
}

async function cargar(manual){
  if(!LF_AUTH) return;
  if(manual) $('act').textContent='Actualizando…';
  const R=rangos(periodo);
  try{
    const [ord,cmpOrd]=await Promise.all([traerOrdenes(R.de,R.a),traerOrdenes(R.cDe,R.cA)]);
    const cmpCorte=cmpOrd.filter(o=>new Date(o.created_at).getTime()<R.cCorte);
    const [items,cmpItems]=await Promise.all([traerItems(ord.map(o=>o.id)),traerItems(cmpCorte.map(o=>o.id))]);
    if(periodo==='hoy'&&ord.length&&_ultimaId&&ord[0].id!==_ultimaId){
      aviso('🍓 Nueva venta de '+money(ord[0].total)+' en '+ord[0].sucursal);
      const m=$('mascota'); m.classList.remove('salta'); void m.offsetWidth; m.classList.add('salta');
    }
    if(ord.length) _ultimaId=ord[0].id;
    D={ord,items,cmp:stats(cmpCorte,cmpItems),R,prods:[]};
    pintar();
    $('act').textContent=new Date().toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});
  }catch(e){ console.warn(e); $('act').textContent='Sin conexión'; if(manual) aviso('No se pudo actualizar. Revisa tu internet.'); }
}

// ═══ PINTAR
function deltaTxt(a,b){
  if(!b) return a?'Sin ventas '+D.R.clbl+' para comparar':'';
  const d=a-b, pct=Math.round(d/b*100);
  if(Math.abs(pct)<1) return 'Igual que '+D.R.clbl;
  return (d>0?'▲ ':'▼ ')+money(Math.abs(d))+' '+(d>0?'más':'menos')+' que '+D.R.clbl;
}
function vsCorto(a,b){ if(!b) return ''; const p=Math.round((a-b)/b*100); return Math.abs(p)<1?'igual':(p>0?'▲ ':'▼ ')+Math.abs(p)+'%'; }

function pintar(){
  const {ord,items,cmp,R}=D, s=stats(ord,items);
  $('v-lbl').textContent=R.lbl+(suc!=='all'?' en '+suc:'');
  const ent=Math.floor(s.total), cent=Math.round((s.total-ent)*100);
  $('v-total').innerHTML='$'+ent.toLocaleString('es-MX')+(cent?'<span class="venta-cent">.'+String(cent).padStart(2,'0')+'</span>':'');
  const dt=deltaTxt(s.total,cmp.total); $('v-delta').hidden=!dt; $('v-delta').textContent=dt;
  $('c-ord').textContent=s.n; $('c-tk').textContent=money(s.tk); $('c-pz').textContent=s.pz;
  $('c-ord-vs').textContent=vsCorto(s.n,cmp.n); $('c-tk-vs').textContent=vsCorto(s.tk,cmp.tk); $('c-pz-vs').textContent=vsCorto(s.pz,cmp.pz);

  $('sec-sucs').style.display=suc==='all'?'':'none';
  const bs={}; ord.forEach(o=>{ const k=o.sucursal||'—'; bs[k]=bs[k]||{t:0,n:0}; bs[k].t+=+o.total||0; bs[k].n++; });
  const ls=Object.entries(bs).sort((a,b)=>b[1].t-a[1].t), mx=ls[0]?ls[0][1].t||1:1;
  $('por-suc').innerHTML=ls.length?ls.map(([k,v])=>`<div class="fila"><span class="nom">${esc(k)}</span><span class="val">${money(v.t)}</span><span class="sub">${v.n} órdenes, ticket de ${money(v.t/v.n)}</span><span class="sub r">${Math.round(v.t/(s.total||1)*100)}%</span><div class="barra"><i style="width:${v.t/mx*100}%"></i></div></div>`).join(''):'<div class="vacio">Todavía no hay ventas en este periodo.</div>';

  const porH={}; ord.forEach(o=>{ const h=mxHora(o.created_at); porH[h]=(porH[h]||0)+(+o.total||0); });
  const hs=[]; for(let h=12;h<=22;h++) hs.push(h);
  Object.keys(porH).forEach(h=>{ h=+h; if(!hs.includes(h)) hs.push(h); }); hs.sort((a,b)=>a-b);
  const mH=Math.max(1,...hs.map(h=>porH[h]||0)), pico=hs.reduce((a,h)=>(porH[h]||0)>(porH[a]||0)?h:a,hs[0]), hAhora=mxNow().getUTCHours();
  $('h-graf').innerHTML=hs.map(h=>`<div class="${h===pico&&porH[h]?'pico':''} ${periodo==='hoy'&&h===hAhora?'ahora':''}" style="height:${(porH[h]||0)/mH*100}%" title="${h12(h)}:00 · ${money(porH[h]||0)}"></div>`).join('');
  $('h-eje').innerHTML=hs.map(h=>`<span>${h%2===0?h12(h):''}</span>`).join('');
  $('h-nota').textContent=porH[pico]?`La mejor hora fue de ${h12(pico)} a ${h12(pico+1)} con ${money(porH[pico])}.`:'';
  $('h-aux').textContent=(periodo==='semana'||periodo==='mes')?'suma del periodo':'';

  const P={efectivo:0,tarjeta:0,transferencia:0}; ord.forEach(o=>{ const p=pagos(o); for(const k in P) P[k]+=p[k]; });
  const cols={efectivo:'#A6182E',tarjeta:'#FD9CB3',transferencia:'#672626'}, nom={efectivo:'Efectivo',tarjeta:'Tarjeta',transferencia:'Transferencia'};
  const tp=(P.efectivo+P.tarjeta+P.transferencia)||1;
  $('p-pila').innerHTML=Object.keys(P).filter(k=>P[k]>0).map(k=>`<i style="width:${P[k]/tp*100}%;background:${cols[k]}"></i>`).join('');
  $('p-ley').innerHTML=Object.keys(P).filter(k=>P[k]>0||k!=='transferencia').map(k=>`<div><span class="punto" style="background:${cols[k]}"></span>${nom[k]}<b>${money(P[k])}</b><em>${Math.round(P[k]/tp*100)}%</em></div>`).join('');

  const bp={}; items.forEach(i=>{ const k=i.product_name||'Producto'; bp[k]=bp[k]||{q:0,r:0}; bp[k].q+=+i.qty||1; bp[k].r+=+i.subtotal||0; });
  D.prods=Object.entries(bp).map(([k,v])=>({k,...v}));
  const top=[...D.prods].sort((a,b)=>b.q-a.q).slice(0,5), mq=top[0]?top[0].q:1;
  $('top5').innerHTML=top.length?top.map(p=>filaProd(p,mq,'q')).join(''):'<div class="vacio">Aquí vas a ver lo que más se vende.</div>';
  $('ult').innerHTML=ord.length?ord.slice(0,5).map(filaOrden).join(''):'<div class="vacio">Sin órdenes todavía.</div>';
  if(vista==='ordenes') pintarOrdenes();
  if(vista==='productos') pintarProductos();
}
function filaProd(p,max,campo){
  const q=campo==='q';
  return `<div class="fila"><span class="nom">${esc(p.k)}</span><span class="val">${q?p.q+' pz':money(p.r)}</span><span class="sub">${q?money(p.r):p.q+' pz'}</span><span></span><div class="barra"><i style="width:${(q?p.q:p.r)/max*100}%"></i></div></div>`;
}
function resumenItems(id){ return D.items.filter(i=>i.order_id===id).map(i=>(i.qty>1?i.qty+'× ':'')+i.product_name).join(', ')||'—'; }
function metodoTxt(o){ const p=pagos(o), m=Object.keys(p).filter(k=>p[k]>0); return m.length>1?'Mixto':(m[0]?m[0][0].toUpperCase()+m[0].slice(1):'Efectivo'); }
function filaOrden(o){
  return `<button class="orden" onclick="abrirOrden(${D.ord.indexOf(o)})"><span class="hora">${periodo==='hoy'||periodo==='ayer'?horaTxt(o.created_at):fechaTxt(o.created_at)}</span><span class="que"><b>${esc(resumenItems(o.id))}</b><span>#${o.order_number||o.id} · ${esc(o.sucursal||'')} · ${metodoTxt(o)}</span></span><span class="tot">${money(o.total)}</span></button>`;
}
function pintarOrdenes(){
  const q=($('o-buscar').value||'').toLowerCase().trim();
  let L=D.ord.filter(o=>filtroPago==='todas'||pagos(o)[filtroPago]>0);
  if(q) L=L.filter(o=>String(o.order_number).includes(q)||(o.client_name||'').toLowerCase().includes(q)||resumenItems(o.id).toLowerCase().includes(q));
  $('o-aux').textContent=L.length+' por '+money(L.reduce((s,o)=>s+(+o.total||0),0));
  $('o-lista').innerHTML=L.length?L.slice(0,300).map(filaOrden).join(''):'<div class="vacio">No hay órdenes con ese filtro.</div>';
}
function pintarProductos(){
  const L=[...(D.prods||[])].sort((a,b)=>ordenProd==='qty'?b.q-a.q:b.r-a.r), max=L[0]?(ordenProd==='qty'?L[0].q:L[0].r):1;
  $('pr-aux').textContent=L.reduce((s,p)=>s+p.q,0)+' piezas';
  $('pr-lista').innerHTML=L.length?L.map(p=>filaProd(p,max,ordenProd==='qty'?'q':'r')).join(''):'<div class="vacio">Sin productos vendidos en este periodo.</div>';
}

async function abrirOrden(idx){
  const o=D.ord[idx]; if(!o) return;
  const cab=`<div class="asa"></div><h3>Orden #${o.order_number||o.id}</h3><div class="info">${fechaTxt(o.created_at)}, ${horaTxt(o.created_at)} · ${esc(o.sucursal)} · cobró ${esc(o.cajero_name||'—')}${o.client_name?' · '+esc(o.client_name):''}</div>`;
  $('hoja').innerHTML=cab+'<div class="vacio">Cargando…</div>';
  $('velo').classList.add('on');
  let it=[]; try{ const r=await fetch(`${SB_URL}/rest/v1/order_items?order_id=eq.${o.id}&select=*`,{headers:H}); if(r.ok) it=await r.json(); }catch(e){}
  const det=i=>{ let t=i.toppings; if(typeof t==='string'){ try{t=JSON.parse(t);}catch(e){t={};} } t=t||{};
    const parts=[]; Object.entries(t).forEach(([k,v])=>{ if(Array.isArray(v)&&v.length) parts.push(v.join(', ')); else if(typeof v==='string'&&v&&k!=='Tamaño'&&k!=='Bases') parts.push(v); });
    return [i.size,i.base,...parts,i.note].filter(Boolean).join(' · '); };
  const p=pagos(o);
  $('hoja').innerHTML=cab+
   (it.map(i=>`<div class="prod"><div class="l1"><span>${i.qty>1?i.qty+'× ':''}${esc(i.product_name)}</span><span>${money2(i.subtotal)}</span></div><div class="l2">${esc(det(i))}</div></div>`).join('')||'<div class="vacio">Sin detalle de productos.</div>')+
   `<div class="tots">
     ${+o.discount_amt?`<div><span>Descuento${o.promo_nombre?' ('+esc(o.promo_nombre)+')':''}</span><span>−${money2(o.discount_amt)}</span></div>`:''}
     ${Object.keys(p).filter(k=>p[k]>0).map(k=>`<div><span>${k[0].toUpperCase()+k.slice(1)}</span><span>${money2(p[k])}</span></div>`).join('')}
     ${+o.change_given?`<div><span>Cambio</span><span>${money2(o.change_given)}</span></div>`:''}
     ${o.loyalty_cliente_id?'<div><span>Lady Lover</span><span>🍓 sellada</span></div>':''}
     <div class="gran"><span>Total</span><span>${money2(o.total)}</span></div>
   </div>`;
}
function cerrarOrden(){ $('velo').classList.remove('on'); }

// ═══ CONTROLES
function setPeriodo(p){ periodo=p; document.querySelectorAll('.periodos button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); _ultimaId=null; cargar(true); }
function setSuc(s,btn){ suc=s; document.querySelectorAll('#sucs button').forEach(b=>b.classList.toggle('on',b===btn)); _ultimaId=null; cargar(true); }
function setFiltroPago(f,btn){ filtroPago=f; document.querySelectorAll('#o-chips button').forEach(b=>b.classList.toggle('on',b===btn)); pintarOrdenes(); }
function setOrdenProd(o,btn){ ordenProd=o; btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn)); pintarProductos(); }
function irA(v){ vista=v; document.querySelectorAll('.vista').forEach(x=>x.classList.toggle('on',x.id==='vista-'+v)); document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); if(v==='ordenes') pintarOrdenes(); if(v==='productos') pintarProductos(); window.scrollTo({top:0}); }
let _avT; function aviso(t){ const a=$('aviso'); a.textContent=t; a.classList.add('on'); clearTimeout(_avT); _avT=setTimeout(()=>a.classList.remove('on'),3200); }

async function cargarSucursales(){
  try{ const r=await fetch(`${SB_URL}/rest/v1/sucursales?select=name&order=name.asc`,{headers:H}); if(!r.ok) return;
    const c=$('sucs'); (await r.json()).forEach(s=>{ const b=document.createElement('button'); b.textContent=s.name; b.onclick=()=>setSuc(s.name,b); c.appendChild(b); }); }catch(e){}
}
function arrancar(){
  if(!_arr){ _arr=true; cargarSucursales(); }
  cargar(); clearInterval(_poll); _poll=setInterval(()=>{ if(LF_AUTH&&!document.hidden&&periodo==='hoy') cargar(); },30000);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&LF_AUTH) cargar(); });
if(LF_AUTH){ document.getElementById('lf-login').style.display='none'; arrancar(); } else mostrarPin('');
</script>
