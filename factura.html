<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#A6182E">
<title>Factura tu ticket · Lady Fresa</title>
<link rel="icon" href="img/marca/icono-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+FEFF,U+FFFD}
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20C0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--vino:#A6182E;--vino-2:#672626;--rosa:#FD9CB3;--rosa-2:#FDEEF1;--fondo:#FDF6F7;--texto:#1a0508;--texto-2:#5a2830;--texto-3:#9a7075;--borde:#f0d6dc}
html,body{background:var(--fondo);color:var(--texto);font-family:'DM Sans',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:32px}
.hero{background:linear-gradient(160deg,#672626 0%,#A6182E 60%,#c41f38 100%);color:#fff;text-align:center;padding:28px 20px 56px;border-radius:0 0 28px 28px}
.hero img{width:150px;max-width:60%;display:block;margin:0 auto 10px}
.hero h1{font-family:'Lilita One',serif;font-weight:400;font-size:28px;letter-spacing:1px}
.hero p{opacity:.9;font-size:14px;margin-top:4px}
.card{background:#fff;border-radius:20px;margin:-36px 16px 0;padding:20px;box-shadow:0 8px 28px rgba(103,38,38,.10);position:relative}
.card+.card{margin-top:14px}
.tk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tk-folio{font-family:'Lilita One',serif;font-size:22px;color:var(--vino)}
.tk-meta{font-size:13px;color:var(--texto-3);margin-top:2px}
.tk-total{font-family:'Lilita One',serif;font-size:26px;color:var(--vino-2);white-space:nowrap}
.tk-items{margin-top:12px;border-top:1px dashed var(--borde);padding-top:10px;font-size:13px;color:var(--texto-2)}
.tk-items div{display:flex;justify-content:space-between;padding:2px 0}
label{display:block;font-size:12px;font-weight:700;color:var(--texto-2);margin:14px 0 6px;letter-spacing:.2px}
label small{font-weight:500;color:var(--texto-3)}
input,select{width:100%;height:50px;border:1.5px solid var(--borde);border-radius:14px;padding:0 14px;font-size:16px;font-family:inherit;color:var(--texto);background:#fff;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--vino)}
input.mal,select.mal{border-color:var(--vino);background:var(--rosa-2)}
.up{text-transform:uppercase}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ayuda{font-size:12px;color:var(--texto-3);margin-top:6px;line-height:1.4}
.btn{width:100%;height:56px;border:none;border-radius:16px;background:var(--vino);color:#fff;font-family:'Lilita One',serif;font-size:20px;letter-spacing:1.5px;margin-top:20px;cursor:pointer;box-shadow:0 6px 18px rgba(166,24,46,.28)}
.btn:disabled{opacity:.6}
.btn-2{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;border:1.5px solid var(--vino);color:var(--vino);text-decoration:none;font-weight:700;font-size:15px;background:#fff}
.descargas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.aviso{text-align:center;padding:8px 4px}
.aviso img{width:120px;display:block;margin:0 auto 8px}
.aviso h2{font-family:'Lilita One',serif;font-weight:400;font-size:24px;color:var(--vino);margin-bottom:6px}
.aviso p{color:var(--texto-2);line-height:1.5;font-size:14px}
.err{background:var(--rosa-2);color:var(--vino-2);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px;line-height:1.45;display:none}
.pie{text-align:center;font-size:12px;color:var(--texto-3);margin-top:22px;padding:0 20px;line-height:1.5}
.pie a{color:var(--vino)}
.cargando{text-align:center;padding:30px 0;color:var(--texto-3)}
.recordar{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--texto-2)}
.recordar input{width:20px;height:20px;accent-color:var(--vino)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="img/marca/logo-blanco.png" alt="Lady Fresa">
    <h1>Factura tu ticket</h1>
    <p>Llena tus datos y te llega a tu correo al momento 🍓</p>
  </div>
  <div id="app"><div class="card"><div class="cargando">Buscando tu ticket…</div></div></div>
  <div class="pie">¿Dudas con tu factura? Pregunta en tu sucursal Lady Fresa.<br><a href="aviso-privacidad.html">Aviso de privacidad</a></div>
</div>
<script>
const FN='https://ngpumyxxxlafuzcsaepy.supabase.co/functions/v1/lf-factura';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ncHVteXh4eGxhZnV6Y3NhZXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNjkzNzYsImV4cCI6MjA4OTg0NTM3Nn0.u4WHkOXLrNn4WSKHJedXXNDYrCMdfaDNK8KlvJNfXLg';
const T=new URLSearchParams(location.search).get('t')||'';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const REG=[['601','601 · General de Ley Personas Morales'],['603','603 · Personas Morales sin fines de lucro'],['605','605 · Sueldos y salarios'],['606','606 · Arrendamiento'],['612','612 · Actividades empresariales y profesionales'],['616','616 · Sin obligaciones fiscales'],['621','621 · Incorporación fiscal'],['625','625 · Plataformas tecnológicas'],['626','626 · Régimen Simplificado de Confianza (RESICO)'],['607','607 · Enajenación de bienes'],['611','611 · Dividendos'],['614','614 · Intereses'],['620','620 · Sociedades cooperativas'],['622','622 · Actividades agrícolas, ganaderas…'],['623','623 · Opcional grupos de sociedades'],['624','624 · Coordinados']];
const USOS=[['G03','G03 · Gastos en general'],['S01','S01 · Sin efectos fiscales'],['G01','G01 · Adquisición de mercancías'],['CP01','CP01 · Pagos']];
async function llamar(body){
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify(body)});
  return r.json().catch(()=>({ok:false,error:'servidor'}));
}
function aviso(img,titulo,txt){ app.innerHTML=`<div class="card"><div class="aviso"><img src="img/marca/${img}" alt=""><h2>${titulo}</h2><p>${txt}</p></div></div>`; }
function tarjetaTicket(tk){
  const f=new Date(tk.fecha);
  const fecha=f.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric',timeZone:'America/Mexico_City'})+' · '+f.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'});
  const items=(tk.items||[]).map(i=>`<div><span>${i.qty>1?i.qty+'× ':''}${esc(i.product_name)}${i.size?' '+esc(i.size):''}</span><span>${money(i.subtotal)}</span></div>`).join('');
  return `<div class="card"><div class="tk-top"><div><div class="tk-folio">Ticket #${esc(tk.folio)}</div><div class="tk-meta">${esc(tk.sucursal)} · ${fecha}</div></div><div class="tk-total">${money(tk.total)}</div></div>${items?`<div class="tk-items">${items}</div>`:''}</div>`;
}
function guardados(){ try{ return JSON.parse(localStorage.getItem('lf_fact_datos')||'{}'); }catch(e){ return {}; } }
function formulario(tk){
  const g=guardados();
  app.innerHTML=tarjetaTicket(tk)+`<div class="card" style="margin-top:14px">
    <label for="f-rfc">RFC</label>
    <input id="f-rfc" class="up" maxlength="13" autocomplete="off" autocapitalize="characters" placeholder="XAXX010101000" value="${esc(g.rfc||'')}">
    <label for="f-razon">Nombre o razón social <small>· tal cual tu Constancia de Situación Fiscal</small></label>
    <input id="f-razon" class="up" autocomplete="name" autocapitalize="characters" placeholder="MARÍA LÓPEZ GARCÍA" value="${esc(g.razon||'')}">
    <div class="ayuda">Sin "S.A. de C.V." ni el régimen de capital: solo el nombre.</div>
    <div class="fila">
      <div><label for="f-cp">C.P. fiscal</label><input id="f-cp" inputmode="numeric" maxlength="5" placeholder="03100" value="${esc(g.cp||'')}"></div>
      <div><label for="f-uso">Uso del CFDI</label><select id="f-uso">${USOS.map(([v,t])=>`<option value="${v}"${(g.uso||'G03')===v?' selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <label for="f-reg">Régimen fiscal</label>
    <select id="f-reg"><option value="">Elige tu régimen…</option>${REG.map(([v,t])=>`<option value="${v}"${g.regimen===v?' selected':''}>${t}</option>`).join('')}</select>
    <label for="f-email">Correo donde te la mandamos</label>
    <input id="f-email" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com" value="${esc(g.email||'')}">
    <label class="recordar"><input type="checkbox" id="f-rec" ${g.rfc?'checked':''}> Recordar mis datos en este celular</label>
    <div class="err" id="f-err"></div>
    <button class="btn" id="f-btn" onclick="enviar()">FACTURAR</button>
  </div>`;
  document.getElementById('f-rfc').addEventListener('input',e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-ZÑ&0-9]/g,''); });
  document.getElementById('f-cp').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/\D/g,''); });
}
const MSG={rfc:'Revisa tu RFC: deben ser 12 caracteres (empresa) o 13 (persona física).',razon:'Escribe tu nombre o razón social.',cp:'El código postal debe tener 5 números.',regimen:'Elige tu régimen fiscal.',uso:'Elige el uso del CFDI.',email:'Revisa tu correo.',facturada:'Este ticket ya se facturó.',global:'Este ticket ya se incluyó en la factura del mes. Pide ayuda en tu sucursal.',no_activa:'La facturación todavía no está disponible para este ticket.',servidor:'No pudimos conectar. Intenta otra vez en un momento.'};
function marcar(id){ const el=document.getElementById(id); if(el){ el.classList.add('mal'); el.focus(); } }
async function enviar(){
  const v=id=>document.getElementById(id).value.trim();
  const d={rfc:v('f-rfc').toUpperCase(),razon:v('f-razon').toUpperCase(),cp:v('f-cp'),regimen:v('f-reg'),uso:v('f-uso'),email:v('f-email')};
  document.querySelectorAll('.mal').forEach(e=>e.classList.remove('mal'));
  const err=document.getElementById('f-err'); err.style.display='none';
  const malo=k=>{ err.textContent=MSG[k]; err.style.display='block'; marcar({rfc:'f-rfc',razon:'f-razon',cp:'f-cp',regimen:'f-reg',email:'f-email'}[k]); };
  if(!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(d.rfc)) return malo('rfc');
  if(d.razon.length<3) return malo('razon');
  if(!/^\d{5}$/.test(d.cp)) return malo('cp');
  if(!d.regimen) return malo('regimen');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return malo('email');
  try{ if(document.getElementById('f-rec').checked) localStorage.setItem('lf_fact_datos',JSON.stringify(d)); else localStorage.removeItem('lf_fact_datos'); }catch(e){}
  const btn=document.getElementById('f-btn'); btn.disabled=true; btn.textContent='FACTURANDO…';
  const r=await llamar({accion:'facturar',t:T,...d});
  if(r.ok) return listo(r.email,r.folio);
  btn.disabled=false; btn.textContent='FACTURAR';
  if(r.error==='sat'){ err.innerHTML='El SAT no aceptó los datos:<br><b>'+esc(r.detalle||'')+'</b><br>Revisa que el nombre, el C.P. y el régimen sean iguales a tu Constancia de Situación Fiscal.'; err.style.display='block'; return; }
  err.textContent=MSG[r.error]||MSG.servidor; err.style.display='block'; if(MSG[r.error]&&['rfc','razon','cp','regimen','email'].includes(r.error)) marcar({rfc:'f-rfc',razon:'f-razon',cp:'f-cp',regimen:'f-reg',email:'f-email'}[r.error]);
}
function descargas(){ return `<div class="descargas"><a class="btn-2" href="${FN}?accion=pdf&t=${encodeURIComponent(T)}">📄 PDF</a><a class="btn-2" href="${FN}?accion=xml&t=${encodeURIComponent(T)}">🧾 XML</a></div>`; }
function listo(email,folio){
  app.innerHTML=`<div class="card"><div class="aviso"><img src="img/marca/mascota-feliz.png" alt=""><h2>¡Listo, ya está tu factura!</h2><p>Te la mandamos a <b>${esc(email)}</b>${folio?' · Folio '+esc(folio):''}.<br>También la puedes bajar aquí:</p></div>${descargas()}</div>`;
}
(async()=>{
  if(!/^[0-9a-f-]{36}$/i.test(T)) return aviso('mascota-hola.png','No encontramos tu ticket','Escanea otra vez el código QR de tu ticket.');
  const r=await llamar({accion:'ticket',t:T});
  if(!r.ok) return aviso('mascota-hola.png','No encontramos tu ticket',r.error==='ticket'?'Si acabas de pagar, espera un minuto y vuelve a escanear el QR.':MSG.servidor);
  const tk=r.ticket;
  if(r.estado==='disponible') return formulario(tk);
  if(r.estado==='facturada'){ app.innerHTML=tarjetaTicket(tk)+`<div class="card" style="margin-top:14px"><div class="aviso"><h2>Este ticket ya está facturado</h2><p>Se facturó a ${esc(r.factura?.rfc||'')} y se mandó a ${esc(r.factura?.email||'')}.</p></div>${descargas()}</div>`; return; }
  const txt={global:'Este ticket ya se incluyó en la factura global del mes, así que ya no se puede facturar por separado. Si la necesitas, pide ayuda en tu sucursal.',cancelada:'Esta venta se canceló, por eso no se puede facturar.',app:'Los pedidos hechos por app se facturan desde la misma app.',no_activa:'La facturación en línea todavía no está disponible para este ticket. Pídela en tu sucursal.'}[r.estado]||MSG.servidor;
  app.innerHTML=tarjetaTicket(tk)+`<div class="card" style="margin-top:14px"><div class="aviso"><h2>No se puede facturar</h2><p>${txt}</p></div></div>`;
})();
</script>
</body>
</html>
